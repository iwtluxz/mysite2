services:
  - type: web
    name: aml-best-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ALLOWED_ORIGINS
        value: https://iwtluxz.github.io
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
